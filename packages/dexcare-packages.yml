note: >-
  DexCare distributes no client library through a public package registry. Both mobile
  SDKs are first-party and real, but neither is installable anonymously: the iOS pod is
  fetched straight from the GitHub source repository (it is not on the CocoaPods trunk,
  which returns 404 for DexcareSDK), and the Android artifact lives in GitHub Packages,
  which DexCare notes "still requires authentication" even though the package is public.
  Nothing named dexcare exists on npm. Version and published dates below are read from
  the GitHub Releases API, the only dated registry metadata available for these
  packages.
packages:
