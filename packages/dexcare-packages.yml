    platform: ios
    registry: github-source
    name: DexcareSDK
    version: 9.8.0
    published: '2026-04-20'
    url: https://github.com/DexCare/DexCareSDK-iOS
    docs: https://developers.dexcarehealth.com/ios/latest/
    install: "pod 'DexcareSDK', :git => 'https://github.com/Dexcare/DexcareSDK-iOS.git'"
    install_pinned: "pod 'DexcareSDK', :git => 'https://github.com/Dexcare/DexcareSDK-iOS.git', :tag => '9.8.0'"
    official: true
    version_source: https://api.github.com/repos/DexCare/DexCareSDK-iOS/releases
    notes: >-
      Distributed via CocoaPods but sourced from the DexCare GitHub repository, not the
      CocoaPods trunk (https://trunk.cocoapods.org/api/v1/pods/DexcareSDK returns 404),
      so `pod search` will not find it and the podfile line must carry the :git source.
      Built as an .xcframework since 6.0 and requires Xcode 12+. Recent releases:
      9.8.0 (2026-04-20), 9.7.0 (2026-03-24), 9.6.0 (2025-11-13).
