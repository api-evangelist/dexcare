    DexCare-managed healthcare environments. The umbrella reference covering the Patient and
    Reporting surfaces, which are documented in prose without an OpenAPI, plus the platform-wide
    domain, authentication and product-parameter conventions. URI-path versioned, OAuth 2.0 + JWT
    bearer auth for PHI/PII endpoints, with open public directory endpoints.
