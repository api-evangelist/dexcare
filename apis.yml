- name: DexCare Care Options API
  description: >-
    Aggregated in-person and virtual appointment discovery across a health system, returning
    available providers and timeslots filtered by location, specialty, visit type and date range.
    OpenAPI 3.0.3, version 1.0.0, 3 operations.
  humanURL: https://developers.dexcarehealth.com/api/careoptions/
  baseURL: https://api.{customerShorthand}.dexcare.io/v1
