- name: DexCare Omni Search API
  description: >-
    Natural-language care search across a health system's clinicians and clinics. Rules-based NLP
    tokenizes and stems the query, expands clinical synonyms, tolerates spelling errors and infers
    intent and location, returning faceted results plus the filters it derived. OpenAPI 3.1.0,
    version 2.21.0, 8 operations.
  humanURL: https://developers.dexcarehealth.com/api/omnisearch/
  baseURL: https://${brand}omni.azurewebsites.net
  tags:
