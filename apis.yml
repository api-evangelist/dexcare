  - type: APIReference
    url: https://developers.dexcarehealth.com/api/oas/omnisearch
- name: DexCare Provider Data Management API
  description: >-
    Schema-driven query and export of the provider, department, location and business-line golden
    record held in DexCare PDM+. The JSON Schema for any entity type is itself retrievable at
    runtime, and batch queries support structured field filters, reference expansion and
    offset/limit paging. OpenAPI 3.1.0, version 1.0.0, 2 operations.
  humanURL: https://developers.dexcarehealth.com/api/pdm/
  baseURL: https://entities-service.{hostname}/v1
