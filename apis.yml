name: DexCare
description: >-
  DexCare is a healthcare navigation and care-orchestration platform, launched from within
  Providence Health, that connects patients to available care across fragmented health systems
  while helping providers fill capacity and reduce wait times. Its products span Search & Schedule,
  Virtual On Demand, Provider Data Management (PDM+), Optimize AI, and Acquire. DexCare exposes a
  RESTful API and native iOS, Android, and JavaScript SDKs that power search-and-schedule, virtual
  visits, patient records, provider data management, care-options discovery, omni search, and
  reporting for health systems. Public directory endpoints are open, while PHI/PII endpoints
  require OAuth 2.0-issued JWT bearer tokens. DexCare operates as a HIPAA business associate. This
  profile was enriched from DexCare's public developer surface as part of the API Evangelist
  network (originally surfaced as an ICONIQ Capital portfolio lead).
