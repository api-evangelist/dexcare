name: DexCare
description: >-
  DexCare is a healthcare navigation and care-orchestration platform, launched from within
  Providence Health, that connects patients to available care across fragmented health systems
  while helping providers fill capacity and reduce wait times. Its products span Search & Schedule,
  Virtual On Demand, Provider Data Management (PDM+), Optimize AI, and Acquire. DexCare publishes
  six OpenAPI definitions on its own developer portal covering 27 operations across the Visit
  Service, Visit Booking, Care Options, Slots Availability, Omni Search and Provider Data
  Management services, alongside prose references for the Patient and Reporting APIs and native
  iOS, Android and JavaScript SDKs. There is no shared base URL: every health system is
  provisioned its own UAT and production hosts, and the published specifications use templated or
  per-tenant servers. Public directory, availability and search endpoints are open, while PHI/PII
  endpoints require an OAuth 2.0-issued JWT bearer token and server-to-server services require a
  DexCare-issued x-api-key. DexCare operates as a HIPAA business associate. This profile was
  enriched from DexCare's public developer surface as part of the API Evangelist network
  (originally surfaced as an ICONIQ Capital portfolio lead).
