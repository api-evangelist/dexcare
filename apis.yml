    estimated wait times. Declares two distinct bearer schemes, PatientJWT and StaffJWT, bound to
    different operations. OpenAPI 3.0.3, version 9.2.0, 9 operations.
  humanURL: https://developers.dexcarehealth.com/api/visits/
  baseURL: https://ecvapi.demo-uat.dex.care/api/9
