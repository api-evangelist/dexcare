    url: https://developers.dexcarehealth.com/api/oas/slots
- name: DexCare Visit Booking API
  description: >-
    Books an in-person appointment for a queued guest visit once a timeslot has been selected.
    OpenAPI 3.0.3, version 1.2.0, 1 operation.
  humanURL: https://developers.dexcarehealth.com/api/booking/
  baseURL: https://api.{customerShorthand}.dexcare.io/v1
