openapi: 3.2.0
info:
  title: Omni Analytics API
  description: API specification for Omni's endpoints. Fast Pages Entities Schema Version - (4.2.2)
  version: 2.21.0
  license:
    name: None
    url: None
servers:
- url: https://dev${brand}omni.azurewebsites.net
  description: Dev Server
- url: https://qa${brand}omni.azurewebsites.net
  description: QA Server
- url: https://uat${brand}omni.azurewebsites.net
  description: Test Server
- url: https://${brand}omni.azurewebsites.net
  description: Prod Server
security:
- {}
tags:
- name: OmniAnalytics
paths:
  /api/OmniAnalytics:
    get:
      operationId: Submit_Analytics_Events
      summary: Omni Analytics
      description: Submit analytics events.
      parameters:
      - $ref: '#/components/parameters/BrandParam'
      - name: debug
        in: query
        schema:
          $ref: '#/components/schemas/debug'
      - name: dh
        in: query
        schema:
          $ref: '#/components/schemas/dh'
      - name: event_name
        in: query
        schema:
          $ref: '#/components/schemas/event_name'
      - name: tid
        in: query
        schema:
          $ref: '#/components/schemas/tid'
      - name: uip
        in: query
        schema:
          $ref: '#/components/schemas/uip'
      - name: v
        in: query
        schema:
          $ref: '#/components/schemas/v'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OmniAnalyticsSuccessResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - type: object
                  properties:
                    validationMessages:
                      description: Validation errors from GA4
                      type: array
                      items:
                        type: string
        '500':
          description: Internal Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Ruin has come to our family.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - OmniAnalytics
components:
  schemas:
    debug:
      default: false
      description: Set to true to include debug information in the response.
      type: boolean
    ErrorResponse:
      description: Error response
      properties:
        error:
          description: Reason for the failure.
          type: string
        errorData:
          description: (Optional) Additional error details, if available.
      type: object
      required:
      - error
    OmniAnalyticsSuccessResponse:
      description: Analytics response from GA
      properties:
        data:
          additionalProperties: true
          description: 'Raw response data from GA.

            This is only included in the response when param `debug=true` is set, but never in production.'
          properties: {}
          type: object
        url:
          description: 'The final generated GA request URL.

            This is only included in the response when param `debug=true` is set, but never in production.'
          type: string
      type: object
    event_name:
      description: Name of event for GA.
      type: string
    dh:
      description: (Ignored) - The document hostname is automatically determined based on brand.
      type: string
    uip:
      description: (Ignored) - The IP address of the user is stripped from the request if included.
      type: string
    tid:
      default: UA-1508202-16
      description: GA tracking ID. Defaults to UA-1508202-16 if not defined.
      type: string
    v:
      description: (Ignored) - The protocol version is hardcoded to 1.
      type: string
  parameters:
    BrandParam:
      name: brand
      in: query
      required: true
      description: (Required) - The brand to lookup results for. The results must exist in that brand's index, or they will be treated as though they don't exist.
      schema:
        type: string
