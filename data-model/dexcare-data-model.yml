docs: https://developers.dexcarehealth.com/api/
note: >-
  Entity graph derived from the six OpenAPI definitions DexCare publishes on its own
  developer portal plus the documented request/response payloads on the REST API
  reference. Four of the six specs inline every schema rather than naming
  components, so entities below are identified from operation payload shapes and
  from the id-reference fields that appear across them; only Omni Search (76 named
  schemas) and Provider Data Management (11) carry a named component library.
identifier_style:
  primary: GUID/UUID
  note: >-
    Most DexCare-native identifiers are GUIDs (patient id, visitId, providerId,
    departmentGuid, visitTypeGuid). Alongside them DexCare carries EMR-native
    identifiers (emrId, departmentEmrId, visitTypeEmrId) and national identifiers
    (NPI for providers), because the platform brokers between health-system EMRs.
    Patient records also carry an identifiers[] array whose entries name the
    issuing system (e.g. org.<healthsystem>.epic.<emr_name>) and a type such as
    mrn, epi, INTERNAL, EXTERNAL, FHIR or FHIR STU3.
entities:
  - name: Patient
    description: A person receiving care, identified by a DexCare GUID and linked to one or more EMR records.
    key: id
    spec: documented on https://developers.dexcarehealth.com/api/patient/
    fields: [id, links, identifiers, name, birthdate, gender, ssn, addresses, email, homePhone, workPhone, mobilePhone, documents]
  - name: Visit
    description: A virtual or in-person care encounter created through the Visit Service.
    key: visitId
    spec: openapi/dexcare-visit-service-openapi.yml
    operations: [createVisitV9, getEstimatedVirtualVisitWaitTime, visitSummaryV9, updateAcceptTerms]
  - name: QueuedGuestVisit
    description: A guest (unauthenticated patient) visit queued for booking.
    spec: openapi/dexcare-visit-booking-openapi.yml
    operations: [createQueuedGuestVisit]
  - name: Practice
    description: A clinical practice within a health system.
    key: practiceId
    spec: openapi/dexcare-visit-service-openapi.yml
  - name: Department
    description: A clinic or department location; the unit timeslots hang off.
    key: departmentId
    alternate_keys: [departmentGuid, departmentUuid, departmentEmrId, urlName]
    spec: openapi/dexcare-care-options-openapi.yml
  - name: Provider
    description: An individual clinician, addressed by DexCare providerId or by national NPI.
    key: providerId
    alternate_keys: [npi]
    spec: openapi/dexcare-slots-availability-openapi.yml
    operations: [getSingleProviderTimeslots, availableProvidersV1]
  - name: Slot
    description: A bookable appointment timeslot on a department or a provider.
    spec: openapi/dexcare-slots-availability-openapi.yml
    operations: [getSlotsAvailability, getAggregatedSlotsV1, aggregatedSlotsV1, slotTaken, slotReleased]
  - name: VisitType
    description: The type of visit a slot supports.
    key: visitTypeId
    alternate_keys: [visitTypeGuid, visitTypeEmrId]
    spec: openapi/dexcare-care-options-openapi.yml
  - name: Modality
    description: A supported care modality (e.g. virtual, in-person).
    spec: openapi/dexcare-visit-service-openapi.yml
    operations: [getModalities]
  - name: Region
    description: A geographic region carrying virtual-care availability and wait times.
    key: regionCode
    spec: openapi/dexcare-visit-service-openapi.yml
    operations: [getRegionAvailabilityAndWaitTimes, getAvailabilityAndWaitTimes]
  - name: AssignmentQualifier
    description: A qualifier used to assign a visit to an eligible provider.
    spec: openapi/dexcare-visit-service-openapi.yml
    operations: [getAssignmentQualifiers]
  - name: Insurance
    description: Patient coverage attached to a visit at booking time.
    fields: [insuranceProviderId, insuranceMemberId, insurancePayorId, insuranceSubscriberId]
    spec: openapi/dexcare-visit-service-openapi.yml
  - name: Entity
    description: >-
      Provider Data Management (PDM) record. PDM is schema-driven — the schema for
