    spec: openapi/dexcare-provider-data-management-openapi.yml
    schemas: [BaseEntity, Entity, AnyEntity, EntityList, EntityQueryResult, PdmEntitySchema, EntitySchemaProperties, JSONSchemaProperty]
    operations: [batchFindEntitiesByType, getPdmEntitySchema]
  - name: ClinicianFastPage
    description: Omni Search denormalized clinician document used to power search results.
    spec: openapi/dexcare-omni-search-openapi.yml
    schemas: [clinicianFastPages, specialtyFastPages, ratingDistributionFastPages, reviewsFastPages]
  - name: DepartmentFastPage
    description: Omni Search denormalized department/clinic document.
