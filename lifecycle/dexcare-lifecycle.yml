release_notes:
  url: https://developers.dexcarehealth.com/home/releasenotes
  platforms: [Core, Search, Availability Service, Discovery, iOS, Android]
  scheme: semver
  note: >-
    Release notes are behind a two-step Platform/Version selector rendered client-side;
