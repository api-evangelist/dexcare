sla: null
support:
  channel: >-
    Named DexCare Customer Success Manager or primary contact via email/Slack, or the
    customer's own Service Desk ticketing system. There is no public support portal and
    no developer support channel for non-customers.
  url: https://developers.dexcarehealth.com/home/support
host_probe:
  - host: api.care.dexcarehealth.com
    resolves: false
    detail: >-
      The REST API reference presents api.care.dexcarehealth.com as the DexCare demo
      ("Acme") production tier and states it "can be used to try out the calls". As of
      2026-08-15 the name resolves to a CNAME, kong.acme.dexcare.engineering, which has
      no address record, so every documented example call against it fails at DNS.
    checked: '2026-08-15'
  - host: ecvapi.demo-uat.dex.care
    resolves: true
    http_status: 404
    detail: >-
      DexCare's demo tenant from the Visit Service servers[] block resolves and
      terminates TLS on a Kong gateway, but the gateway matches no route and returns
      {"message":"no Route matched with those values"}.
    checked: '2026-08-15'
