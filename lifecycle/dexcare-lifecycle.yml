support_policy:
  url: https://developers.dexcarehealth.com/home/support
deprecation:
  documented: true
  policy_url: https://developers.dexcarehealth.com/home/support
  reference_url: https://developers.dexcarehealth.com/api/deprecated/
  trigger: publication of a newer version
  end_of_support: >-
    90 days after the release of the latest version of an API or SDK, unless a customer
    contract carves out an exception.
  end_of_life: >-
    The final day of the last remaining customer contracted for support. The EOL date
    is published in the deprecated functionality's documentation header, and on that
    date the documentation is removed from the developer portal.
  evidence: >-
    DexCare publishes a written Support and Deprecation Policy with a quantified EOS
    window: "End of Support (EOS) occurs 90 days after the release of the latest
    version of an API or SDK unless there is an exception in a customer contract."
    Deprecated APIs are collected in a dedicated Deprecated section of the reference,
    and the SDKs publish migration guides across the 7.x -> 8.x -> 9.x lines.
  rfc8594: false
  rfc8594_note: >-
    No Sunset or Deprecation response header is documented, and none is declared in any
    of the six published OpenAPI definitions. The policy is prose-only, so a machine
    cannot detect an impending EOS from a response.
  gap: >-
    Documentation is REMOVED at EOL rather than archived, so an integrator running an
    older contracted version loses their reference the day the last other customer
    leaves it.
deprecated_surfaces:
  - name: Visits v8 API
    url: https://developers.dexcarehealth.com/api/deprecated/
    note: Superseded by the v9 Visit Service; retained for existing implementations.
  - name: Timeslots v4 API
    url: https://developers.dexcarehealth.com/api/deprecated/
    note: Superseded by the v5 Slots Availability API.
deprecated_operations: []
deprecated_operations_note: >-
  No operation in any of the six published specifications carries `deprecated: true`.
  Deprecation is expressed by moving a whole API version into the Deprecated section of
  the documentation, not by marking operations in the contract.
status_page: null
status_page_note: >-
  DexCare publishes no status page. Probed status.dexcare.com, status.dexcarehealth.com
